name: Sweep

# Every 5 minutes: asks the live site to check the Outlook mailbox and work
# through queued jobs (retries, anything left over). Needed because Vercel's
# Hobby plan only runs cron jobs once a day; on Vercel Pro you can instead
# add {"path": "/api/cron/jobs", "schedule": "* * * * *"} to vercel.json.
# Set the repository secrets BILLIE_URL (e.g. https://billie.example.com)
# and CRON_SECRET (the same value as in Vercel). Without them it does nothing.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run Billie's job sweep
        env:
          BILLIE_URL: ${{ secrets.BILLIE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BILLIE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BILLIE_URL or CRON_SECRET isn't set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BILLIE_URL/api/cron/jobs"
