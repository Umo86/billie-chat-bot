<title>Billie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an ops console. A left rail like a hall directory, a quiet working grid,
   and status shown the way venue signage shows it: short words on solid chips. */
:root {
  --bg: #f3f5f4;
  --panel: #ffffff;
  --sunk: #e8eeec;
  --ink: #132220;
  --muted: #566661;
  --line: #d4dedb;
  --accent: #0d6a5b;
  --accent-ink: #ffffff;
  --accent-soft: #d8eee8;
  --signal: #f2c230;
  --signal-ink: #2a2000;
  --good: #1b7548;
  --good-soft: #dbf0e3;
  --warn: #8f5c00;
  --warn-soft: #f8ebcd;
  --bad: #b23a28;
  --bad-soft: #f7dfd9;
  --focus: #1f5fd8;
  --scrim: rgb(10 20 18 / 45%);
  --shadow: 0 1px 2px rgb(19 34 32 / 6%), 0 10px 28px rgb(19 34 32 / 9%);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --panel: #141d1b; --sunk: #1b2624; --ink: #e5edea; --muted: #9aaaa5; --line: #283633;
    --accent: #48baa7; --accent-ink: #03201b; --accent-soft: #173a34; --signal: #f2c230; --signal-ink: #2a2000;
    --good: #5ec58f; --good-soft: #15382a; --warn: #e4b05a; --warn-soft: #3a2b10; --bad: #ef8069; --bad-soft: #3e1e18;
    --focus: #7da9ff; --scrim: rgb(0 0 0 / 60%); --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 28px rgb(0 0 0 / 38%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --panel: #141d1b; --sunk: #1b2624; --ink: #e5edea; --muted: #9aaaa5; --line: #283633;
  --accent: #48baa7; --accent-ink: #03201b; --accent-soft: #173a34; --signal: #f2c230; --signal-ink: #2a2000;
  --good: #5ec58f; --good-soft: #15382a; --warn: #e4b05a; --warn-soft: #3a2b10; --bad: #ef8069; --bad-soft: #3e1e18;
  --focus: #7da9ff; --scrim: rgb(0 0 0 / 60%); --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 28px rgb(0 0 0 / 38%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 116%; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.95rem); font-weight: 780; letter-spacing: -0.01em; }
h2 { font-size: 1.12rem; font-weight: 730; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.label { font-size: 0.74rem; font-weight: 680; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* frame */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px; max-width: 1440px; margin: 0 auto; min-height: 100vh; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 12px; max-height: calc(100vh - 32px); overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand .word { font-family: var(--f-display); font-stretch: 125%; font-weight: 830; font-size: 1.55rem; letter-spacing: -0.015em; line-height: 1; }
.mark { width: 22px; height: 22px; border-radius: 7px 7px 7px 2px; background: var(--accent); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--signal); border: 2px solid var(--panel); }
.brand-sub { padding: 0 8px; font-size: 0.8rem; color: var(--muted); }
.nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; cursor: pointer; text-align: left; font-weight: 580; }
.nav-btn svg { color: var(--muted); flex: none; }
.nav-btn:hover { background: var(--sunk); }
.nav-btn.on { background: var(--accent-soft); }
.nav-btn.on svg { color: var(--accent); }
.count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--signal); color: var(--signal-ink); font-size: 0.74rem; font-weight: 780; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; padding-bottom: 56px; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; max-height: none; padding: 10px; gap: 10px; }
  .brand-sub, .rail-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  .nav-btn { white-space: nowrap; width: auto; padding: 8px 11px; }
}

/* page furniture */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head .lede { margin-top: 6px; color: var(--muted); max-width: 64ch; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); }
.banner svg { flex: none; margin-top: 2px; color: var(--warn); }
.note { padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 0.9rem; }
.note.warn { background: var(--warn-soft); }
.note.bad { background: var(--bad-soft); }
.note.good { background: var(--good-soft); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 28px 22px; border: 1px dashed var(--line); border-radius: 14px; background: var(--panel); }
.empty h2 { font-size: 1.05rem; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 620; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 640; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 0.87rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; filter: none; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 0; background: none; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 6px; font-size: 0.75rem; font-weight: 720; letter-spacing: 0.02em; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.needs { background: var(--signal); color: var(--signal-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

/* home */
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: left; cursor: pointer; min-width: 0; }
.stat:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.stat .n { font-family: var(--f-display); font-stretch: 122%; font-weight: 820; font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1; min-width: 1.6ch; text-align: center; }
.stat.hot .n { background: var(--signal); color: var(--signal-ink); border-radius: 8px; padding: 5px 9px; }
.stat .t { font-weight: 600; line-height: 1.3; }
@media (max-width: 700px) { .strip { grid-template-columns: minmax(0, 1fr); } }
.bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.bot-card { display: flex; flex-direction: column; gap: 14px; }
.bot-top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.bot-top h2 { overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.fact b { display: block; font-family: var(--f-display); font-stretch: 118%; font-size: 1.3rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.fact span { font-size: 0.78rem; color: var(--muted); }
.av { border-radius: 50%; display: inline-grid; place-items: center; font-weight: 760; flex: none; object-fit: cover; letter-spacing: 0.02em; font-family: var(--f-display); font-stretch: 110%; line-height: 1; }
.av.ring { box-shadow: 0 0 0 2px rgb(255 255 255 / 85%); }

/* wizard */
.stepper { display: flex; gap: 6px; overflow-x: auto; list-style: none; margin: 0; padding: 0 0 2px; }
.stepper button { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; font-weight: 620; }
.stepper button[disabled] { cursor: not-allowed; opacity: 0.55; }
.stepper .num { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--sunk); font-size: 0.8rem; font-weight: 760; font-variant-numeric: tabular-nums; }
.stepper .on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stepper .on .num { background: var(--accent); color: var(--accent-ink); }
.stepper .done .num { background: var(--good-soft); color: var(--good); }
.say { font-size: 1.04rem; font-weight: 600; }
.wiz-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; }
.split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* forms */
.form { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > .lab, .field > legend { font-weight: 660; font-size: 0.92rem; padding: 0; }
.hint { font-size: 0.82rem; color: var(--muted); }
.err { font-size: 0.85rem; color: var(--bad); font-weight: 600; }
input:not([type]), input[type="text"], input[type="email"], input[type="url"], input[type="tel"], input[type="time"], input[type="search"], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
textarea { resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.75; }
.choice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--panel); position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.choice:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.choice-t { font-weight: 700; }
.choice-h { font-size: 0.84rem; color: var(--muted); }
.tchips { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 580; }
.tchip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.inline-add { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-add input { flex: 1 1 220px; width: auto; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days .tchip { padding: 5px 10px; }
.times { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.times input { width: 120px; }
.avatar-pick { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* chat */
.chat { display: flex; flex-direction: column; width: 100%; max-width: 400px; height: 560px; max-height: 78vh; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.chat.test { max-width: none; box-shadow: none; height: 540px; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 13px; flex: none; }
.chat-head .t { font-weight: 760; line-height: 1.2; }
.chat-head .s { font-size: 0.76rem; opacity: 0.88; }
.chat-head .icon-btn { color: inherit; margin-left: auto; }
.chat-head .icon-btn:hover { background: rgb(255 255 255 / 18%); color: inherit; }
.chat-body { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 94%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg .bw { display: flex; flex-direction: column; min-width: 0; }
.bubble { padding: 8px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot .bubble { border-bottom-left-radius: 4px; }
.msg.user .bubble { background: var(--ink); color: var(--panel); border-color: var(--ink); border-bottom-right-radius: 4px; }
.msg.agent .bubble { background: var(--accent-soft); border-color: transparent; border-bottom-left-radius: 4px; }
.msg.system { align-self: center; max-width: 100%; }
.msg.system .bubble { background: transparent; border: 1px dashed var(--line); font-size: 0.84rem; color: var(--muted); text-align: center; }
.who { font-size: 0.74rem; color: var(--muted); margin: 0 0 3px 3px; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.src { font-size: 0.72rem; padding: 2px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.src b { color: var(--warn); font-weight: 720; }
.rate { display: flex; gap: 2px; margin-top: 2px; }
.rate button { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: 6px; color: var(--muted); cursor: pointer; }
.rate button:hover { background: var(--sunk); }
.rate button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.starters { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 34px; }
.starters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 0.85rem; cursor: pointer; }
.starters button:hover { border-color: var(--accent); }
.chat-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); flex: none; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; border-radius: 999px; padding-left: 14px; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; flex: none; }
.send[disabled] { opacity: 0.45; cursor: not-allowed; }
.fine { font-size: 0.72rem; color: var(--muted); text-align: center; }
.offer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 9px; margin-left: 34px; }
.offer form { display: grid; gap: 8px; }
.offer input { min-height: 36px; }

/* try it */
.try-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.site { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); min-height: 680px; }
.site-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.site-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.site-hero { padding: 30px 26px; display: flex; flex-direction: column; gap: 8px; }
.site-hero b { font-family: var(--f-display); font-stretch: 122%; font-size: clamp(1.3rem, 1rem + 1.5vw, 2rem); font-weight: 800; line-height: 1.1; }
.site-body { padding: 22px 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.site-body div { display: flex; flex-direction: column; gap: 8px; }
.skel { height: 11px; border-radius: 6px; background: var(--sunk); }
.skel.tall { height: 90px; border-radius: 10px; }
.launcher { position: absolute; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 6px 16px 6px 6px; cursor: pointer; font-weight: 700; box-shadow: var(--shadow); }
.site .chat { position: absolute; right: 18px; bottom: 76px; height: 540px; max-height: calc(100% - 92px); }
@media (max-width: 640px) {
  .site-body { grid-template-columns: minmax(0, 1fr); }
  .site .chat { left: 8px; right: 8px; bottom: 8px; width: auto; max-width: none; height: calc(100% - 52px); max-height: none; }
}
.phone { width: 100%; max-width: 390px; margin: 0 auto; border-radius: 36px; border: 10px solid var(--ink); background: var(--ink); height: 700px; max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
.phone .chat { max-width: none; height: 100%; max-height: none; border: 0; border-radius: 26px; box-shadow: none; }
.route-btns { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 34px; }

/* inbox and lists */
.split-list { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .split-list { grid-template-columns: minmax(0, 1fr); } }
.list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

function joinPdfItems(items) {

function chunkText(text, label) {
  const MAX = 1100;
  const paras = String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(s => s.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
  const out = []; let cur = '';

  for (const p of paras) {
    if (p.length > MAX) {
      flush();
      const sentences = p.split(/(?<=[.!?])\s+/);
      for (const s of sentences) {

        if (s.length > MAX) { for (let i = 0; i < s.length; i += MAX) out.push(s.slice(i, i + MAX)); continue; }
        cur = cur ? cur + ' ' + s : s;

    g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);

function botStats(bot, days = 7) {
  const since = Date.now() - days * 86400000;
  const convs = S.convs.filter(c => c.botId === bot.id && (c.createdAt || 0) >= since && !S.hidden.has(c.id));
  const handed = convs.filter(c => c.handoverAt).length;
  const passages = S.sources.filter(s => (bot.kbIds || []).includes(s.kbId) && !S.hidden.has(s.id)).reduce((n, s) => n + (s.chunkCount || 0), 0);
  return { chats: convs.length, handed, passages };
}

function Msg({ m, bot, onRate, agentName }) {

    ${onRate ? html`<div class="rate"><button aria-label="Helpful" aria-pressed=${m.rating === 'up' ? 'true' : 'false'} onClick=${() => onRate(m, 'up')}><${Icon} n="up" s=${15} /></button><button aria-label="Not helpful" aria-pressed=${m.rating === 'down' ? 'true' : 'false'} onClick=${() => onRate(m, 'down')}><${Icon} n="down" s=${15} /></button></div>` : null}
  </div></div>`;
}
function ChatPanel({ bot, channel = 'web', persist = true, onClose, variant = 'widget', preface }) {
  const s = useS();

  const [form, setForm] = useState({ name: '', company: '', stand: '', email: '', phone: '' });
  const [formErr, setFormErr] = useState('');
  const cid = useRef(null), ctl = useRef(null), bodyRef = useRef(null), reason = useRef('unknown');
  useEffect(() => { if (!persist || !convId) return undefined; return S.db.doc('conversations/' + convId).onSnapshot(sn => setConv(sn.exists ? Object.assign({ id: sn.id }, sn.data()) : null), () => {}); }, [convId, persist]);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const msgs = useMemo(() => { const m = new Map(); if (conv && conv.msgs) Object.values(conv.msgs).forEach(x => { if (x && x.id) m.set(x.id, x); }); local.forEach(x => { if (!m.has(x.id)) m.set(x.id, x); }); return [...m.values()].sort((a, b) => (a.at - b.at) || (a.id < b.id ? -1 : 1)); }, [conv, local]);
  const msgsRef = useRef(msgs); msgsRef.current = msgs;
  const status = (conv && conv.status) || 'bot';
  const statusRef = useRef(status); statusRef.current = status;
  const agentIds = msgs.filter(m => m.role === 'agent').map(m => m.agentId);
  const prof = useProfiles(agentIds);
  useEffect(() => { const el = bodyRef.current; if (el) el.scrollTop = el.scrollHeight; }, [msgs.length, busy, offer]);
  const addLocal = m => setLocal(l => [...l, m]);
  async function pushMsg(m, extra) {
    addLocal(m);
    if (!persist) return;
    try {
      if (!cid.current) {
        const id = 'c_' + newId(); cid.current = id;
        await dbSet('conversations/' + id, Object.assign({ botId: bot.id, botName: bot.name, channel, status: 'bot', createdAt: Date.now(), updatedAt: Date.now(), firstQuestion: m.role === 'user' ? m.text : '', lastText: m.text, msgs: { [m.id]: m }, visitor: {}, by: S.me.id || null }, extra || {}));
        setConvId(id);
      } else {
        await dbUpdate('conversations/' + cid.current, Object.assign({ msgs: { [m.id]: m }, updatedAt: Date.now(), lastText: m.text }, extra || {}));
      }
    } catch (e) { /* toasted */ }
  }
  const sys = text => ({ id: newId('m'), role: 'system', text, at: Date.now() });
  async function handover(why) {
    reason.current = why;
    if (!persist) { addLocal(sys(why === 'always_human' ? 'Test chat: in a live chat this goes straight to the team, because it is an always-human topic.' : 'Test chat: in a live chat Billie would pass this to the team now.')); setOffer(null); return; }
    if (agentsOnline().length) { await pushMsg(sys('Connecting you to the ops team. Someone will reply here shortly.'), { status: 'waiting', handoverReason: why, handoverAt: Date.now() }); setOffer(null); }
    else setOffer('form');
  }
  async function send(raw) {
    const text = String(raw || '').trim();
    if (!text || busy) return;
    setInput('');
    if (offer === 'offer') setOffer(null);
    const um = { id: newId('m'), role: 'user', text, at: Date.now() };
    await pushMsg(um);
    if (['waiting', 'live'].includes(statusRef.current)) return;
    if (!S.sample) { addLocal(sys(S.aiNote || 'Bots need Claude to answer.')); return; }
    setBusy(true);
    const c = new AbortController(); ctl.current = c;
    try {
      const history = msgsRef.current.filter(x => x.role !== 'system' && x.id !== um.id);
      const r = await askBot(bot, history, text, { signal: c.signal });
      const bm = { id: newId('m'), role: 'bot', text: r.answer || 'I don’t have that information.', at: Date.now(), sources: r.sources, handover: r.handover, topic: r.topic };
      await pushMsg(bm);
      if (r.handover === 'unknown') { if (persist) recordGap(bot, text); reason.current = 'unknown'; setOffer('offer'); }
      else if (r.handover === 'always_human' || r.handover === 'asked_for_person') await handover(r.handover);
    } catch (e) { const t = aiErrorText(e); if (t) addLocal(sys(t)); }
    finally { setBusy(false); ctl.current = null; }
  }
  async function rate(m, val) {
    const v = m.rating === val ? null : val;
    if (persist && cid.current) { try { await dbUpdate('conversations/' + cid.current, { msgs: { [m.id]: { rating: v } } }); } catch (e) { /* toasted */ } }
    setLocal(l => l.map(x => (x.id === m.id ? Object.assign({}, x, { rating: v }) : x)));
    if (v === 'down') { const bots = msgsRef.current.filter(x => x.role === 'bot'); const i = bots.findIndex(x => x.id === m.id); if (i > 0 && bots[i - 1].rating === 'down') { reason.current = 'unhappy'; setOffer('offer'); } }
  }
  async function submitForm(e) {

    const missing = need.filter(k => !String(form[k] || '').trim());
    if (missing.length) { setFormErr('Please add your ' + missing.map(k => FIELD_LABEL[k].toLowerCase()).join(' and ') + '.'); return; }
    if (form.email && !/^\S+@\S+\.\S+$/.test(form.email.trim())) { setFormErr('Check the email address.'); return; }
    setFormErr('');
    const v = {}; Object.keys(form).forEach(k => { const x = String(form[k] || '').trim(); if (x) v[k] = x.slice(0, 120); });
    await pushMsg(sys('Thanks' + (v.name ? ', ' + v.name.split(' ')[0] : '') + '. The team will reply ' + ((bot.rules && bot.rules.promise) || 'by the next working day') + '.'), { status: 'ticket', handoverReason: reason.current, handoverAt: Date.now(), visitor: v });
    setOffer('done');
  }
  const collect = (bot.rules && bot.rules.collect) || ['name', 'email'];
  const userCount = msgs.filter(m => m.role === 'user').length;
  const color = bot.color || COLORS[0];
  const head = { background: color, color: textOn(color) };
  const subLine = status === 'live' ? 'Chatting with the ops team' : status === 'waiting' ? 'Waiting for the ops team' : status === 'ticket' || status === 'replied' ? 'The team will reply by email' : 'AI assistant · answers from the show’s own information';
  const starters = (bot.starters || []).filter(Boolean);
  return html`<section class=${'chat ' + variant} aria-label=${'Chat with ' + bot.name}>
    <header class="chat-head" style=${head}><${Avatar} bot=${bot} size=${34} ring=${true} /><div><div class="t">${bot.name}</div><div class="s">${subLine}</div></div>${onClose ? html`<button class="icon-btn" aria-label="Close chat" onClick=${onClose}><${Icon} n="x" /></button>` : null}</header>
    <div class="chat-body" ref=${bodyRef} aria-live="polite">
      ${preface || null}
      <div class="msg bot"><${Avatar} bot=${bot} size=${26} /><div class="bw"><div class="bubble">${bot.welcome || suggestedWelcome(bot)}</div></div></div>
      ${!userCount && starters.length ? html`<div class="starters">${starters.map((t, i) => html`<button key=${i} onClick=${() => send(t)}>${t}</button>`)}</div>` : null}
      ${msgs.map(m => html`<${Msg} key=${m.id} m=${m} bot=${bot} onRate=${m.role === 'bot' ? rate : null} agentName=${m.role === 'agent' ? ((prof(m.agentId) && prof(m.agentId).name) || 'Ops team') : null} />`)}
      ${busy ? html`<div class="msg bot"><${Avatar} bot=${bot} size=${26} /><div class="bubble typing" role="status" aria-label=${bot.name + ' is typing'}><span></span><span></span><span></span></div></div>` : null}
      ${offer === 'offer' ? html`<div class="offer"><b>Want me to pass this to the ops team?</b><div class="row"><button class="btn sm primary" onClick=${() => handover(reason.current || 'unknown')}>Yes, pass it on</button><button class="btn sm" onClick=${() => setOffer(null)}>No thanks</button></div></div>` : null}
      ${offer === 'form' ? html`<div class="offer"><b>The team is offline right now</b><span class="small muted">Hours: ${hoursText(bot.rules && bot.rules.hours)}. Leave your details and they’ll reply ${(bot.rules && bot.rules.promise) || 'by the next working day'}.</span>
        <form onSubmit=${submitForm} noValidate>${collect.map(k => html`<input key=${k} id=${'f-c-' + k + '-' + variant} type=${k === 'email' ? 'email' : k === 'phone' ? 'tel' : 'text'} placeholder=${FIELD_LABEL[k] + (k === 'name' || k === 'email' ? '' : ' (optional)')} aria-label=${FIELD_LABEL[k]} value=${form[k]} onInput=${e => setForm(Object.assign({}, form, { [k]: e.target.value }))} />`)}
        ${formErr ? html`<span class="err" role="alert">${formErr}</span>` : null}<button class="btn sm primary" type="submit">Send to the team</button></form></div>` : null}
    </div>
    <footer class="chat-foot">
      <form class="composer" onSubmit=${e => { e.preventDefault(); send(input); }}>
        <input id=${'chat-in-' + variant} value=${input} onInput=${e => setInput(e.target.value)} placeholder=${status === 'live' || status === 'waiting' ? 'Message the ops team' : 'Ask a question'} aria-label="Your message" autocomplete="off" maxlength="600" />
        <button class="send" type="submit" style=${head} aria-label="Send" disabled=${!input.trim() || busy}><${Icon} n="send" /></button>
      </form>
      <p class="fine">${persist ? 'AI assistant. Chats are kept for ' + (s.settings.retentionMonths || 12) + ' months.' : 'Test chat. Nothing here is saved.'}</p>
    </footer>
  </section>`;
}

function Reports({ go }) {
  const s = useS();
  const since = Date.now() - 30 * 86400000;
  const convs = s.convs.filter(c => (c.createdAt || 0) >= since && !s.hidden.has(c.id));
  const handed = convs.filter(c => c.handoverAt).length;
  const answeredPct = convs.length ? Math.round(((convs.length - handed) / convs.length) * 100) : 0;
  const emails = s.emails.filter(e => (e.receivedAt || 0) >= since && !s.hidden.has(e.id));
  const drafted = emails.filter(e => e.status === 'draft' || e.status === 'sent').length;
  const gapsOpen = s.gaps.filter(g => g.status === 'open').length;
  const top = useMemo(() => { const m = new Map(); convs.forEach(c => { const q = c.firstQuestion; if (!q) return; const k = normQ(q); const x = m.get(k) || { q, n: 0 }; x.n++; m.set(k, x); }); return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 8); }, [s.convs]);
  const hours = Array.from({ length: 24 }, () => 0); convs.forEach(c => { if (c.createdAt) hours[londonHour(c.createdAt)]++; });
  const max = Math.max(1, ...hours);
  const peak = hours.indexOf(Math.max(...hours));

  const W = 480, H = 150, bw = W / 24;
  return html`
    <header class="page-head"><div><h1>Reports</h1><p class="lede">The last 30 days. Use the gaps and top questions to decide what to add to the knowledge next.</p></div></header>
    <div class="kpis">
      <div class="kpi"><b>${convs.length}</b><span>chats</span></div>
      <div class="kpi"><b>${convs.length ? answeredPct + '%' : '–'}</b><span>answered by Billie alone</span></div>
      <div class="kpi"><b>${handed}</b><span>passed to the team</span></div>
      <div class="kpi"><b>${drafted}</b><span>email replies drafted</span></div>
      <div class="kpi"><b>${gapsOpen}</b><span>open gaps</span></div>

    <div class="two">
      <section class="panel"><div class="panel-head"><h2>Top questions</h2></div>
        ${top.length ? html`<div class="table-wrap"><table><thead><tr><th>Question</th><th class="num">Times</th></tr></thead><tbody>${top.map((t, i) => html`<tr key=${i}><td>${t.q}</td><td class="num">${t.n}</td></tr>`)}</tbody></table></div>` : html`<p class="muted small">No chats yet. Try a bot to see questions here.</p>`}
      </section>
      <section class="panel"><div class="panel-head"><h2>Busiest hours</h2><span class="small muted">UK time${convs.length ? ', peak ' + String(peak).padStart(2, '0') + ':00' : ''}</span></div>
        <div style=${{ overflowX: 'auto' }}><svg class="bars" viewBox=${'0 0 ' + W + ' ' + (H + 22)} width="100%" role="img" aria-label=${'Chats by hour of day' + (convs.length ? ', busiest at ' + peak + ':00' : '')}>
          <line x1="0" x2=${W} y1=${H} y2=${H} />
          ${hours.map((n, i) => { const h = Math.round((n / max) * (H - 10)); return html`<rect key=${i} class=${n && i === peak ? 'peak' : 'b'} x=${i * bw + 2} y=${H - h} width=${bw - 4} height=${h} rx="2"><title>${String(i).padStart(2, '0')}:00 · ${plural(n, 'chat')}</title></rect>`; })}
          ${[0, 6, 12, 18, 23].map(i => html`<text key=${i} x=${i * bw + bw / 2} y=${H + 15} text-anchor="middle">${String(i).padStart(2, '0')}</text>`)}
        </svg></div>
      </section>
    </div>
    <section class="panel"><div class="panel-head"><h2>By bot</h2></div>
      <div class="table-wrap"><table><thead><tr><th>Bot</th><th class="num">Chats</th><th class="num">Passed to team</th><th class="num">Answered alone</th><th class="num">Open gaps</th><th class="num">Last test</th></tr></thead>

    </section>`;

  const [confirm, setConfirm] = useState(false);
  const [role, setRole] = useState('');
  useEffect(() => { let on = true; (async () => { if (!S.user) { if (on) setRole(S.mode === 'local' ? 'Local demo' : ''); return; } const owner = await S.user.isOwner().catch(() => false); const edit = await S.user.canEdit().catch(() => false); if (on) setRole(owner ? 'Owner: full control' : edit ? 'Editor: bots, knowledge and settings' : S.readOnly ? 'Viewer: can look, can’t save' : 'Contributor: can chat, reply and add knowledge'); })(); return () => { on = false; }; }, [s.readOnly]);
  const months = s.settings.retentionMonths || 12;
  const old = s.convs.filter(c => (c.updatedAt || 0) < Date.now() - months * 30.4 * 86400000);
  const setMonths = async m => { try { await upsert('settings/main', { retentionMonths: m }); toast('Chats will be kept for ' + m + ' months.', 'good'); } catch (e) { /* toasted */ } };
  const purge = () => { setConfirm(false); const ids = old.map(c => c.id); undoableDelete(plural(ids.length, 'old chat'), ids, async () => { for (const id of ids) await dbDelete('conversations/' + id).catch(() => {}); }); };
  return html`
    <header class="page-head"><div><h1>Settings</h1><p class="lede">Who can do what, where Billie is connected, and how long chats are kept.</p></div></header>
    <div class="two">
      <section class="panel stack"><h2>You</h2>
        <div class="row"><img src=${s.me.avatarUrl || ''} alt="" width="40" height="40" style=${{ borderRadius: '50%', display: s.me.avatarUrl ? 'block' : 'none' }} /><div class="stack" style=${{ gap: '2px' }}><b>${s.me.name || 'You'}</b><span class="small muted">${role}</span></div></div>
        <p class="small muted">Roles come from how Billie is shared. Editors manage bots and settings. Contributors answer chats and add knowledge. Viewers can only look.</p>
      </section>
      <section class="panel stack"><h2>Privacy</h2>
        <${Field} id="f-ret" label="Keep chats and emails for" hint="Shown to visitors under the chat box. Add Billie’s AI providers to the privacy notice."><select id="f-ret" style=${{ maxWidth: '220px' }} value=${String(months)} onChange=${e => setMonths(Number(e.target.value))}>${[6, 12, 24].map(m => html`<option key=${m} value=${String(m)}>${m} months</option>`)}</select></${Field}>
        ${old.length ? (confirm ? html`<div class="row"><span class="small">Delete ${plural(old.length, 'chat')} older than ${months} months?</span><button class="btn sm danger" onClick=${purge}>Delete</button><button class="btn sm" onClick=${() => setConfirm(false)}>Keep</button></div>` : html`<button class="btn sm" style=${{ alignSelf: 'flex-start' }} onClick=${() => setConfirm(true)}><${Icon} n="trash" /> Delete ${plural(old.length, 'old chat')}</button>`) : html`<p class="small muted">No chats are older than ${months} months.</p>`}
      </section>
    </div>
    <section class="panel"><div class="panel-head"><h2>Connections</h2></div>
      <div class="channel"><span class="ic"><${Icon} n="globe" /></span><div class="stack" style=${{ gap: '4px' }}><div class="row"><h3>Websites and exhibitor manual</h3><span class="chip good">Ready</span></div><p class="small muted">Each bot has its own embed code under Edit, then Go live.</p></div></div>
      <div class="channel"><span class="ic"><${Icon} n="mail" /></span><div class="stack" style=${{ gap: '4px' }}><div class="row"><h3>Outlook ops mailbox</h3><span class="chip warn">Not connected</span></div><p class="small muted">Needs Media10 IT to register an app with Microsoft Graph Mail.ReadWrite, limited to the ops mailbox. Mail.Send only if auto-send is agreed.</p></div></div>
      <div class="channel"><span class="ic"><${Icon} n="phone" /></span><div class="stack" style=${{ gap: '4px' }}><div class="row"><h3>WhatsApp Business</h3><span class="chip warn">Not connected</span></div><p class="small muted">Needs Meta business verification, a number with an approved display name, and a payment method in Billing Hub. Replies cost about 2 US cents each after 1,000 free a month per number.</p></div></div>
      <div class="channel"><span class="ic"><${Icon} n="bot" /></span><div class="stack" style=${{ gap: '4px' }}><div class="row"><h3>Claude</h3><span class=${'chip ' + (s.aiOff ? 'warn' : 'good')}>${s.aiOff ? 'Not available here' : 'Connected'}</span></div><p class="small muted">${s.aiOff ? s.aiNote : 'In this prototype, answers run on the Claude account of whoever is chatting. The live version uses Media10’s own API key.'}</p></div></div>
    </section>`;
}

/* ============================================================== start */
const root = document.getElementById('app');
root.textContent = '';
render(html`<${App} />`, root);
boot();
})();
</script>
